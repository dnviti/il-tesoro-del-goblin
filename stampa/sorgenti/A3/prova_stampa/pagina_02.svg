<text x="20.00" y="36.00" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >Tieni il foglio controluce, con il fronte e il retro sovrapposti: la croce del fronte deve cadere al centro dei cerchi (1, 2, 3, 4, 5 mm di raggio). Leggi lo scarto in mm nelle 5 posizioni; se è più di 1 mm, o</text><text x="20.00" y="40.38" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >diverso tra un bersaglio e l’altro, leggi «Fronte-retro non allineato» nelle istruzioni A4.</text>
