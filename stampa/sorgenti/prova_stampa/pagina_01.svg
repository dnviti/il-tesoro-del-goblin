<text x="170.00" y="67.00" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >misura i lati</text>
<text x="20.00" y="104.00" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >1. Stampa al 100% («Dimensioni effettive», MAI «Adatta alla pagina»), carta A4, SOLO FRONTE (niente fronte-retro, nemmeno</text><text x="20.00" y="108.38" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >manuale).</text>
<text x="20.00" y="114.95" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >2. Scala: misura il righello (100 mm tra 0 e 10) e il quadrato (50 mm). Va bene entro ±1 mm. Se no, disattiva «adatta/riduci» e</text><text x="20.00" y="119.33" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >ristampa.</text>
<text x="20.00" y="125.90" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >3. Margini: il riquadro sottile a 6,5 mm dal bordo deve vedersi su tutti e 4 i lati. Se manca un lato la stampante taglia il margine: carte,</text><text x="20.00" y="130.28" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >plance e tacche stanno oltre i 6,5 mm.</text>
<text x="20.00" y="136.85" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >Se tutto torna, stampa il resto del kit nell’ordine di ISTRUZIONI_DI_STAMPA.md. Le carte e i loro dorsi sono su fogli separati: si</text><text x="20.00" y="141.22" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >uniscono a mano (colla stick o bustina).</text>
<text x="20.00" y="153.80" font-family="Liberation Sans Narrow" font-size="3.40" fill="#000000" text-anchor="start" font-weight="bold" >File del kit A4 (fogli, tutti solo fronte)</text>
