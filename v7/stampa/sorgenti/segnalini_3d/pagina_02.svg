<line x1="55" y1="266.00" x2="155" y2="266.00" stroke="#222222" stroke-width="0.25"/><line x1="55" y1="264.00" x2="55" y2="268.00" stroke="#222222" stroke-width="0.25"/><line x1="155" y1="264.00" x2="155" y2="268.00" stroke="#222222" stroke-width="0.25"/><text x="105.00" y="271.00" font-family="Liberation Sans Narrow" font-size="2.60" fill="#6b4a2b" text-anchor="middle" >Segmento di controllo: 100 mm esatti. Stampa al 100 % (print-scaling=none, MAI «adatta alla pagina»).</text>
<text x="105.00" y="277.00" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Stampa su A4 al 100%, solo fronte, carta adesiva o cartoncino sottile 160 g. Taglia sulla linea scura (linea spessa = taglio dell’adesivo).</text><text x="105.00" y="280.60" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Il dorso si incolla al centro del fondo piatto: coperta, la tessera mostra il dorso.</text>
