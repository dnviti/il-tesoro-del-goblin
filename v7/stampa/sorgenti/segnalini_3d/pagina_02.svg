<text x="105.00" y="277.00" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Stampa su A4 al 100%, solo fronte, carta adesiva o cartoncino sottile 160 g. Taglia sulla linea scura (linea spessa = taglio dell’adesivo).</text><text x="105.00" y="280.60" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Il dorso si incolla al centro del fondo piatto (1,1 mm di margine): coperta, la tessera mostra il dorso e tiene il fronte nella tasca.</text>
