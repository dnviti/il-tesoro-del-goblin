<text x="105.00" y="283.00" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Stampa su A4 al 100%, solo fronte. Taglia sulla linea scura: la carta entra nella tasca del segnalino 3D («?» Ø 20 mm, tasca 20,5; Cripta 25,2 mm da lato a lato, tasca 25,7).</text><text x="105.00" y="286.60" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Incolla ogni carta nella tasca sopra del segnalino 3D. Misure delle carte prese dal generatore 3D (carta_domanda 20 mm); da verificare con la prima stampa.</text>
