<text x="257.00" y="61.00" font-family="Liberation Sans Narrow" font-size="3.60" fill="#000000" text-anchor="middle" font-weight="bold" >50 × 50 mm</text>
<text x="257.00" y="67.00" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >misura i lati</text>
<text x="20.00" y="104.00" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >1. Stampa al 100% («Dimensioni effettive», MAI «Adatta alla pagina»), carta A3, SOLO FRONTE. Eccezioni: mappa_fiori.pdf, segnalini.pdf (A4) / componenti_misti.pdf e tessere_esplorazione.pdf (A3):</text><text x="20.00" y="108.38" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >fronte e retro a mano sul lato lungo (le istruzioni sono sui fogli).</text>
<text x="20.00" y="114.95" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >2. Scala: misura il righello (100 mm tra 0 e 10) e il quadrato (50 mm). Va bene entro ±1 mm. Se no, disattiva «adatta/riduci» e ristampa.</text>
<text x="20.00" y="121.53" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >3. Margini: il riquadro sottile a 6,5 mm dal bordo deve vedersi su tutti e 4 i lati. Se manca un lato la stampante taglia il margine: carte, plance e tacche stanno oltre i 6,5 mm.</text>
<text x="20.00" y="128.10" font-family="Liberation Sans Narrow" font-size="3.50" fill="#000000" text-anchor="start" >Se tutto torna, stampa il resto del kit nell’ordine dell’elenco qui sotto. Le carte e i loro dorsi sono su fogli separati: si uniscono a mano (colla stick o bustina).</text>
