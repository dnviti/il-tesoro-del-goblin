<text x="105.00" y="275.80" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Stampa su A4 al 100%. Ritaglia il rettangolo di ogni pedina. Piega sulla linea tratteggiata bianca (al centro) e incolla fronte e retro.</text><text x="105.00" y="279.40" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Piega le due linguette chiare (tratteggio grigio) una in avanti e una indietro: ottieni un piede a T per far stare in piedi la sagoma.</text><text x="105.00" y="283.00" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Eroi, MIMI e Geronimo: larghezza 24 mm (stanno in un esagono). Boss: 40 mm (stanno nei cerchi della Sala del Tesoro). Colori degli eroi = colori dei dorsi di classe.</text><text x="105.00" y="286.60" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Rotella della Profezia (Oracolo): ritaglia il disco e la finestra, taglia la base sul bordo sottile; disco sulla base col fermacampioni.</text><text x="105.00" y="290.20" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >P pari · D dispari · A alto (4+ su un D6, 8+ su 2D6) · B basso (3− su un D6, 6− su 2D6).</text>
</svg>
