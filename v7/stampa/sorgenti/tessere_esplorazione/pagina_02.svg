<text x="105.00" y="283.00" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Stampa la pagina 1, rimetti il foglio nel cassetto girato sul LATO LUNGO e stampa questa pagina; poi taglia sul cerchio del fronte.</text><text x="105.00" y="286.60" font-family="Liberation Sans Narrow" font-size="2.80" fill="#6b4a2b" text-anchor="middle" >Controlla in controluce: il cerchio del fronte deve cadere dentro l’abbondanza del dorso. Senza fronte-retro: stampa solo la pagina 1 (dorso bianco).</text>
